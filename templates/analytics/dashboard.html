{% extends 'base.html' %}

{% block title_content %}SaaS Subscription Analytics Cockpit{% endblock %}

{% block content %}
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h2 class="fw-bold text-dark mb-0">SaaS Metrics Analytics</h2>
            <p class="text-muted mb-0 small">Asynchronous pre-aggregated financial time-series snapshots.</p>
        </div>

        <!-- HTMX Button to trigger recalculation without form parameters -->
        <button hx-post="{% url 'analytics:recalculate' %}"
                hx-target="#metrics-and-logs-target"
                hx-indicator="#loading-spinner"
                class="btn btn-sm btn-dark fw-medium py-2 px-3 shadow-sm">
            🔄 Force Metrics Recalculation
        </button>
    </div>

    <!-- Dynamic Asset Loading Spinner Status Loader -->
    <div id="loading-spinner" class="htmx-indicator progress mb-4" style="height: 4px;">
        <div class="progress-bar progress-bar-striped progress-bar-animated bg-primary" role="progressbar" style="width: 100%"></div>
    </div>

    <!-- Main Asynchronous Target Shell Node -->
    <div id="metrics-and-logs-target"
         hx-get="{% url 'analytics:dashboard' %}"
         hx-trigger="load"
         hx-target="this">
        <div class="text-center py-5 text-muted">
            <div class="spinner-border spinner-border-sm text-secondary me-2" role="status"></div>
            <span>Accessing secure metrics vault streams...</span>
        </div>
    </div>

    <div class="mt-4">
        <a href="{% url 'dashboard:home' %}" class="btn btn-link text-secondary text-decoration-none small p-0">
            ← Return to Main Console Dashboard
        </a>
    </div>
{% endblock %}
